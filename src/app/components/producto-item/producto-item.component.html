<ion-card>
  <ion-item lines="none">
    <img
      slot="start"
      [src]="producto.imagen"
      [alt]="producto.nombre"
      class="producto-img"
    />

    <ion-label>
      <h2>{{ producto.nombre }}</h2>
      <p>{{ producto.precio }} €</p>
      <p>{{ producto.descripcion }}</p>
    </ion-label>
  </ion-item>
</ion-card>
